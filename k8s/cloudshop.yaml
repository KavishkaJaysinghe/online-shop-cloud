apiVersion: v1
kind: Secret
metadata:
  name: cloudshop-secret
type: Opaque
stringData:
  JWT_SECRET: replace-with-long-random-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      containers:
        - name: auth
          image: cloudshop-auth:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: MONGODB_AUTH_URI, value: mongodb://mongo-auth:27017/auth }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cloudshop-secret, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: product }
spec:
  replicas: 2
  selector: { matchLabels: { app: product } }
  template:
    metadata: { labels: { app: product } }
    spec:
      containers:
        - name: product
          image: cloudshop-product:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - { name: MONGODB_PRODUCT_URI, value: mongodb://mongo-product:27017/products }
            - { name: RABBITMQ_URL, value: amqp://rabbitmq:5672 }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cloudshop-secret, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order }
spec:
  replicas: 2
  selector: { matchLabels: { app: order } }
  template:
    metadata: { labels: { app: order } }
    spec:
      containers:
        - name: order
          image: cloudshop-order:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          env:
            - { name: MONGODB_ORDER_URI, value: mongodb://mongo-order:27017/orders }
            - { name: RABBITMQ_URL, value: amqp://rabbitmq:5672 }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cloudshop-secret, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: cloudshop-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          env:
            - { name: AUTH_URL, value: http://auth:3000 }
            - { name: PRODUCT_URL, value: http://product:3001 }
            - { name: ORDER_URL, value: http://order:3002 }
          readinessProbe: { httpGet: { path: /health, port: 3003 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo-auth }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo-auth } }
  template:
    metadata: { labels: { app: mongo-auth } }
    spec: { containers: [{ name: mongo, image: mongo:7, ports: [{ containerPort: 27017 }] }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo-product }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo-product } }
  template:
    metadata: { labels: { app: mongo-product } }
    spec: { containers: [{ name: mongo, image: mongo:7, ports: [{ containerPort: 27017 }] }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo-order }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo-order } }
  template:
    metadata: { labels: { app: mongo-order } }
    spec: { containers: [{ name: mongo, image: mongo:7, ports: [{ containerPort: 27017 }] }] }
---
apiVersion: v1
kind: Service
metadata: { name: auth }
spec: { selector: { app: auth }, ports: [{ port: 3000, targetPort: 3000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: product }
spec: { selector: { app: product }, ports: [{ port: 3001, targetPort: 3001 }] }
---
apiVersion: v1
kind: Service
metadata: { name: order }
spec: { selector: { app: order }, ports: [{ port: 3002, targetPort: 3002 }] }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec: { selector: { app: rabbitmq }, ports: [{ name: amqp, port: 5672, targetPort: 5672 }, { name: ui, port: 15672, targetPort: 15672 }] }
---
apiVersion: v1
kind: Service
metadata: { name: mongo-auth }
spec: { selector: { app: mongo-auth }, ports: [{ port: 27017, targetPort: 27017 }] }
---
apiVersion: v1
kind: Service
metadata: { name: mongo-product }
spec: { selector: { app: mongo-product }, ports: [{ port: 27017, targetPort: 27017 }] }
---
apiVersion: v1
kind: Service
metadata: { name: mongo-order }
spec: { selector: { app: mongo-order }, ports: [{ port: 27017, targetPort: 27017 }] }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec: { type: LoadBalancer, selector: { app: api-gateway }, ports: [{ port: 80, targetPort: 3003 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: product-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: product }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
